name: Construir APK ElectroIsla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Encontrar proyecto Android
        shell: bash
        run: |
          set -e

          echo "Buscando proyecto Android..."

          PROJECT_DIR=$(find . -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Mostrar proyecto
        run: |
          echo "Proyecto: $PROJECT_DIR"
          echo "Contenido:"
          ls -la "$PROJECT_DIR"
          echo ""
          echo "Build Gradle:"
          ls -la "$PROJECT_DIR/app"

      - name: Preparar actualización
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Preparando proyecto ElectroIsla..."
          echo "Versión de Gradle:"
          gradle --version

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Buscar APK
        run: |
          echo "APK generados:"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.ELECTROISLA_KEYSTORE_B64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Falta el Secret ELECTROISLA_KEYSTORE_B64"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > electroisla-release.keystore

          echo "Keystore preparada."

      - name: Firmar APK
        env:
          STORE_PASSWORD: ${{ secrets.ELECTROISLA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ELECTROISLA_KEY_PASSWORD }}
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*release*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK Release."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          echo "Build Tools: $BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -f 4 \
            "$APK" \
            ElectroIsla-9.9.1-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks electroisla-release.keystore \
            --ks-key-alias my-key-alias \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out ElectroIsla-9.9.1.apk \
            ElectroIsla-9.9.1-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            ElectroIsla-9.9.1.apk

          echo "APK firmado correctamente."

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectroIsla-9.9.1
          path: ElectroIsla-9.9.1.apk
          if-no-files-found: error
