name: Construir APK ElectroIsla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Encontrar y descomprimir proyecto
        shell: bash
        run: |
          set -e

          echo "Buscando archivo ZIP del proyecto..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            echo "Archivos disponibles:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP_FILE"

          mkdir -p proyecto

          unzip -o "$ZIP_FILE" -d proyecto

          echo ""
          echo "Contenido después de descomprimir:"
          find proyecto -maxdepth 4 -type f | head -100

          echo ""
          echo "Buscando settings.gradle..."

          SETTINGS_FILE=$(find proyecto -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Proyecto Android encontrado en:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Mostrar proyecto
        run: |
          echo "Proyecto:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Contenido del proyecto:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Contenido de app:"
          ls -la "$PROJECT_DIR/app"

      - name: Preparar actualización
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Preparando proyecto ElectroIsla..."

          echo ""
          echo "Versión de Java:"
          java -version

          echo ""
          echo "Versión de Gradle:"
          gradle --version

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Buscar APK
        run: |
          echo "APK generados:"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.ELECTROISLA_KEYSTORE_B64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Falta el Secret ELECTROISLA_KEYSTORE_B64"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > electroisla-release.keystore

          echo "Keystore preparada correctamente."

      - name: Firmar APK
        env:
          STORE_PASSWORD: ${{ secrets.ELECTROISLA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ELECTROISLA_KEY_PASSWORD }}
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró el APK Release."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          echo ""
          echo "Android Build Tools:"
          echo "$BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" -f 4 \
            "$APK" \
            ElectroIsla-9.9.1-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks electroisla-release.keystore \
            --ks-key-alias my-key-alias \
            --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out ElectroIsla-9.9.1.apk \
            ElectroIsla-9.9.1-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            ElectroIsla-9.9.1.apk

          echo ""
          echo "APK firmado correctamente."

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectroIsla-9.9.1
          path: ElectroIsla-9.9.1.apk
          if-no-files-found: error
